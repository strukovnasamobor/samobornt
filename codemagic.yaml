workflows:
  ios-simulator:
    name: Samobor NT - iOS (Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - appetize
      vars:
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Sanity check
        script: |
          ls -la ios-capacitor/App
          xcodebuild -list -project ios-capacitor/App/App.xcodeproj
      - name: Generate firebase.js
        script: node scripts/write-firebase-config.mjs
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Build unsigned simulator .app
        script: |
          xcodebuild \
            -project "ios-capacitor/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios-capacitor/output \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip the .app bundle
        script: |
          cd ios-capacitor/output/Build/Products/Debug-iphonesimulator
          zip -r ios_app.zip "$XCODE_SCHEME.app"
    artifacts:
      - ios-capacitor/output/Build/Products/Debug-iphonesimulator/ios_app.zip

  ios-release:
    name: Samobor NT - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Must match the App Store Connect API key name in Codemagic exactly.
      app_store_connect: "App Store Connect - Personal"
    environment:
      groups:
        # Supplies the Firebase config consumed by scripts/write-firebase-config.mjs
        # (firebase.js is gitignored, so CI regenerates it before the web build).
        - appetize
      vars:
        APP_ID: 6805843670
        BUNDLE_ID: hr.strukovnasamobor.samobornt
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate firebase.js
        script: node scripts/write-firebase-config.mjs
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set build number
        script: |
          set -e
          # Take the highest build number Apple knows about. TestFlight is the one
          # that matters (App Store Connect rejects duplicates against it), but the
          # released App Store number is checked too in case it is ever ahead.
          # Either command exits non-zero when there is nothing to report, hence
          # the fallbacks and the integer guard.
          num_or_zero() {
            v=$(printf '%s' "$1" | tr -d '[:space:]')
            case "$v" in
              '' | *[!0-9]* ) echo 0 ;;
              * ) echo "$v" ;;
            esac
          }
          TF=$(num_or_zero "$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null | tail -1)")
          AS=$(num_or_zero "$(app-store-connect get-latest-app-store-build-number "$APP_ID" 2>/dev/null | tail -1)")
          LATEST=$TF
          if [ "$AS" -gt "$LATEST" ]; then LATEST=$AS; fi
          BUILD_NUMBER=$((LATEST + 1))
          echo "TestFlight=$TF AppStore=$AS -> building $BUILD_NUMBER"
          cd ios-capacitor/App
          agvtool new-version -all "$BUILD_NUMBER"
          agvtool what-version
      - name: Set up code signing
        script: |
          # Diagnostic: show what this App Store Connect key can actually see.
          app-store-connect list-bundle-ids --bundle-id-identifier "$BUNDLE_ID" || true
          keychain initialize
          # --create makes the distribution certificate / App Store profile if
          # they do not exist yet. The implicit ios_signing block only fetches,
          # which is why the build failed with "No matching profiles found".
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios-capacitor/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true