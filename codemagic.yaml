workflows:
  ios-simulator:
    name: Samobor NT - iOS (Appetize)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      groups:
        - appetize
      vars:
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Sanity check
        script: |
          ls -la ios-capacitor/App
          xcodebuild -list -project ios-capacitor/App/App.xcodeproj
      - name: Generate firebase.js
        script: node scripts/write-firebase-config.mjs
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Build unsigned simulator .app
        script: |
          xcodebuild \
            -project "ios-capacitor/App/App.xcodeproj" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios-capacitor/output \
            CODE_SIGNING_ALLOWED=NO
      - name: Zip the .app bundle
        script: |
          cd ios-capacitor/output/Build/Products/Debug-iphonesimulator
          zip -r ios_app.zip "$XCODE_SCHEME.app"
    artifacts:
      - ios-capacitor/output/Build/Products/Debug-iphonesimulator/ios_app.zip

  ios-release:
    name: Samobor NT - iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        # Supplies the Firebase config consumed by scripts/write-firebase-config.mjs
        # (firebase.js is gitignored, so CI regenerates it before the web build).
        - appetize
      ios_signing:
        distribution_type: app_store
        bundle_identifier: hr.strukovnasamobor.samobornt
      vars:
        APP_ID: 6805843670
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate firebase.js
        script: node scripts/write-firebase-config.mjs
      - name: Install and build web
        script: |
          npm ci
          npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Set build number
        script: |
          cd ios-capacitor/App
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_ID" || echo 0)
          agvtool new-version -all $(($LATEST + 1))
      - name: Apply provisioning profile
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios-capacitor/App/App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true