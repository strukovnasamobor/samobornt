apply plugin: 'com.android.application'

// Release signing credentials, in order of preference:
//  1. android-capacitor/keystore.properties (storeFile/storePassword/
//     keyAlias/keyPassword) - what CI writes from its secured variables.
//  2. The PWABuilder key sheet in .google_play/signing-key-info.txt, so a
//     plain `gradlew bundleRelease` on a dev machine is signed with no setup.
// Both are gitignored; with neither present the release build stays unsigned.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
} else {
    def infoFile = rootProject.file('../.google_play/signing-key-info.txt')
    if (infoFile.exists()) {
        // Free text, "Key store password: ..." style - not loadable as
        // Properties because the field names contain spaces.
        def fields = [:]
        infoFile.readLines().each { line ->
            def idx = line.indexOf(':')
            if (idx > 0) fields[line.substring(0, idx).trim()] = line.substring(idx + 1).trim()
        }
        def storeName = fields['Key store file'] ? new File(fields['Key store file']).name : null
        if (storeName && fields['Key store password'] && fields['Key alias'] && fields['Key password']) {
            signingProps['storeFile'] = rootProject.file('../.google_play/' + storeName).absolutePath
            signingProps['storePassword'] = fields['Key store password']
            signingProps['keyAlias'] = fields['Key alias']
            signingProps['keyPassword'] = fields['Key password']
        }
    }
}
def hasReleaseSigning = signingProps['storeFile'] && file(signingProps['storeFile']).exists()

android {
    namespace = "com.strukovnasamobor.samobornt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.strukovnasamobor.samobornt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 14
        versionName "2.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // Provides WebSettingsCompat — used in MainActivity.java to disable
    // force-dark on the WebView so Samsung's "Sync with device theme" can't
    // recolor the page.
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
