<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Samobor N&amp;T</title>
  <style>
    :root { --bg: #ffffff; --fg: #000000; --muted: rgba(0,0,0,0.65); --brand: #9e0020; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121212; --fg: #ffffff; --muted: rgba(255,255,255,0.7); }
    }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font-family: sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
    img.icon { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 28px; }
    h1 { font-size: 20px; margin: 0 0 10px; font-weight: 600; }
    p { font-size: 15px; margin: 0 0 24px; color: var(--muted); max-width: 28em; line-height: 1.45; }
    button { background: var(--brand); color: #fff; border: 0; border-radius: 6px;
      padding: 12px 26px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.85; }
    .spinner { width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(128,128,128,0.25); border-top-color: var(--brand);
      animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
  </style>

    <!-- State A: neutral splash while we silently retry into the cached app -->
    <div id="splash">
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
    <!-- State B: shown only once every silent retry has bounced back here -->
    <div id="offline" hidden>
      <h1 id="title">No internet connection</h1>
      <p id="msg">Samobor N&amp;T needs the internet the first time it runs. Connect and open it again &mdash; after that it works offline.</p>
      <button id="retry" type="button">Retry</button>
    </div>

  <script>
    (function () {
      var APP_URL = 'https://samobornt.web.app/';
      var KEY = 'snt_offline_recovery';
      // On a cold launch the WebView has not started the samobornt.web.app
      // service-worker thread yet, so an immediate re-navigation fails the same
      // way and bounces straight back here. Retry with a growing delay to give
      // the worker time to wake and take control of the navigation, at which
      // point it serves the cached shell. Only when every delay has failed do
      // we conclude there is genuinely nothing cached to show.
      var RETRY_DELAYS = [350, 800, 1600];
      var FRESH_MS = 15000;

      if ((navigator.language || '').toLowerCase().indexOf('hr') === 0) {
        document.documentElement.lang = 'hr';
        document.getElementById('title').textContent = 'Nema internetske veze';
        document.getElementById('msg').innerHTML =
          'Samobor N&amp;T treba internet pri prvom pokretanju. Spojite se i otvorite ju ponovno &mdash; nakon toga radi bez veze.';
        document.getElementById('retry').textContent = 'Pokušaj ponovno';
      }

      function read() {
        try {
          var st = JSON.parse(sessionStorage.getItem(KEY) || 'null');
          if (st && (Date.now() - st.ts) <= FRESH_MS) return st;
        } catch (e) {}
        return { count: 0, ts: Date.now() };
      }
      function goToApp(count) {
        try { sessionStorage.setItem(KEY, JSON.stringify({ count: count, ts: Date.now() })); } catch (e) {}
        location.replace(APP_URL); // replace(): this page never enters the back-stack
      }

      var st = read();
      if (st.count < RETRY_DELAYS.length) {
        setTimeout(function () { goToApp(st.count + 1); }, RETRY_DELAYS[st.count]);
      } else {
        document.getElementById('splash').hidden = true;
        document.getElementById('offline').hidden = false;
      }

      document.getElementById('retry').addEventListener('click', function () { goToApp(0); });
      window.addEventListener('online', function () { goToApp(0); });
    })();
  </script>
